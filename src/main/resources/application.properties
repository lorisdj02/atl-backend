spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/atl_database
spring.datasource.username=postgres
spring.datasource.password=postgres

server.port=8081

#server.ssl.enabled=true
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=backend

# Force JSON serialization/deserialization in UTC
spring.jackson.time-zone=UTC

# Force JDBC/Hibernate timestamps in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Local image storage (project root: .storage)
app.storage.path=.storage
app.storage.public-base-url=/storage

# Public base URL used to expose absolute URLs to clients
app.public.base-url=http://10.0.2.2:8081